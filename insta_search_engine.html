<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram search engine</title>
    <link rel="stylesheet" href="insta_search.css">
</head>

<body>
    <div class="main-box">
        <div class="logo">
            <img src="download.jfif" alt="Instagram Logo" class="logo-img">
            <h1>Instagram</h1>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" class="input" placeholder="Search name or username">
            </div>
            <div> <button class="button">Search</button></div>
        </div>
        <div class="search-results">
            <h2>Search Results:</h2>
            <div class="profile-card">

                <img src="khawar.jpeg" alt="Profile Picture" class="profile-img">
                <div class="profile-info">
                    <h3>Khawar Abbas</h3>
                    <p>@khawarabbas</p>
                    <span>10.2k followers</span>
                </div>
                <button class="follow-button">Follow</button>
            </div>

            <div class="profile-card">
                <img src="Ali Hassan.jpeg" alt="Profile Picture" class="profile-img">
                <div class="profile-info">
                    <h3>Ali Hassan</h3>
                    <p>@alihassan</p>
                    <span>15.7k followers</span>
                </div>
                <button class="follow-button">Follow</button>
            </div>

            <div class="profile-card">
                <img src="m usman.jpeg" alt="Profile Picture" class="profile-img">
                <div class="profile-info">
                    <h3>Muhammad Usman</h3>
                    <p>@muhammadusman</p>
                    <span>9.1k followers</span>
                </div>
                <button class="follow-button">Follow</button>
            </div>
        </div>
    </div>

</body>

</html>
