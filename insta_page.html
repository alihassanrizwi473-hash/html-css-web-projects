<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="insta.css">
</head>

<body>
    <div class="login-box">
        <div class="main">
            <div class="logo">
                <h1>Instagram</h1>
                <input type="text" class="input" placeholder="phone number,Username,email">
            </div>
            <br>
            <div class="password-box">
                <input type="text" class="input" placeholder="Password">
            </div>
            <br>
            <div class="login">
                <button class="button">Log In</button>
            </div>
            <br>
            <div class="or">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>
            <br>
            <div class="facebook">
                <img src="download.png" alt="Facebook Logo" class="facebook-logo">
                <a href="#" class="facebook-button">Log in with Facebook</a>
            </div>
            <br>
            <div class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>
        </div>
    </div>
    <div class="signup-box">
        <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
</body>

</html>
