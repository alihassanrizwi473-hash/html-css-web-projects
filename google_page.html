<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="google.css">
</head>

<body>

    <header>

        <div class="top-left">
            <a href="#">About</a>
            <a href="#">Store</a>
        </div>

        <div class="top-right">
            <a href="#">Gmail</a>
            <a href="#">Images</a>

            <a href="#">
                <div class="apps">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </a>

            <button class="sign-in">Sign in</button>
        </div>

    </header>


    <main>

        <h1>
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </h1>


        <div class="search-box">

            <span class="plus">+</span>

            <span class="ask-google">Ask Google</span>

            <input type="text">

             <span class="search-icon">⌕</span>

            <span class="lens-icon">◉</span>

            <button class="ai-mode">
                ✨ AI Mode
            </button>

        </div>


        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>


        <div class="language">

            <span>Google offered in:</span>

            <a href="#">English</a>
            <a href="#">Español</a>
            <a href="#">Urdu</a>

        </div>

    </main>


    <footer>

        <div class="country">
            <p>Pakistan</p>
        </div>

        <div class="footer-links">

            <div>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>

            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>

        </div>

    </footer>

</html>
