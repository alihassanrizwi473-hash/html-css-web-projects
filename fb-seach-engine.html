<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Search</title>
    <link rel="stylesheet" href="facebook.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="download.png" class="logo-img">
            <h2>facebook</h2>
        </div>

        <div class="search-container">
            <input type="text" class="input" placeholder="Search Facebook">
            <button class="button">Search</button>
        </div>

    </header>


    <main class="main-box">

        <aside class="filters">

            <h2>Search Results</h2>

            <div class="filter-item active">All</div>
            <div class="filter-item">People</div>
            <div class="filter-item">Posts</div>
            <div class="filter-item">Pages</div>
            <div class="filter-item">Groups</div>

        </aside>


        <section class="results">

            <h2>People</h2>


            <div class="profile-card">

                <img src="Ali Hassan.jpeg" class="profile-img">

                <div class="profile-info">
                    <h3>Ali Hassan</h3>
                    <p>Computer Science Student</p>
                    <span>Gomal University</span>
                </div>

                <button class="follow-button">Add Friend</button>

            </div>


            <div class="profile-card">

                <img src="khawar.jpeg" class="profile-img">

                <div class="profile-info">
                    <h3>Ahmed Khan</h3>
                    <p>Software Developer</p>
                    <span>Lahore, Pakistan</span>
                </div>

                <button class="follow-button">Add Friend</button>

            </div>


            <div class="profile-card">

                <img src="m usman.jpeg" class="profile-img">

                <div class="profile-info">
                    <h3>Usman Ahmad</h3>
                    <p>Web Developer</p>
                    <span>Islamabad, Pakistan</span>
                </div>

                <button class="follow-button">Add Friend</button>

            </div>


            <div class="profile-card">

                <img src="profile4.jpg" class="profile-img">

                <div class="profile-info">
                    <h3>Hamza Ali</h3>
                    <p>Student</p>
                    <span>Pakistan</span>
                </div>

                <button class="follow-button">Add Friend</button>

            </div>

        </section>

    </main>

</body>

</html>
